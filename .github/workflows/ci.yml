name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: ./ci.db
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # 历史 UI 组件仍有 lint 债务，先以非阻断方式接入，清零后移除 continue-on-error。
      - name: Lint (non-blocking until legacy UI cleanup)
        run: npx eslint --max-warnings 0
        continue-on-error: true

      - name: Unit tests
        run: node --import ./scripts/ts-resolve.mjs --test tests/auth.test.ts tests/validation.test.ts tests/migrations.test.ts tests/repository.test.ts

      - name: Database migration
        run: node --import ./scripts/ts-resolve.mjs scripts/migrate.ts

      - name: Build
        run: npx next build
